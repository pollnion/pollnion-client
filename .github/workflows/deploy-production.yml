name: Deploy - Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build EAS for production
        run: |
          eas build --platform all --profile production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build web app
        run: npx expo export --platform web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-web-build
          path: dist/

      - name: Deploy to production
        env:
          PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment script here
          # Example: bash scripts/deploy-production.sh

      - name: Upload to app stores (optional)
        run: |
          echo "Uploading builds to app stores..."
          # eas submit --platform all --latest

      - name: Create GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          tag: prod-${{ github.run_number }}
          name: Production Release ${{ github.run_number }}
          body: |
            Production deployment from commit ${{ github.sha }}

            **Branch:** main
            **Build Number:** ${{ github.run_number }}
            **Status:** ✅ Deployed to production

            ### What's New
            - Check the commit history for changes

            ### Deploy Information
            - All tests passed ✓
            - Code linted ✓
            - Builds created ✓
          artifacts: './dist/**'
          draft: false
          prerelease: false

      - name: Send Slack notification - Success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Production Deployment Success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful* ✅\n*Build:* #${{ github.run_number }}\n*Branch:* main\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send Slack notification - Failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Production Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed* ❌\n*Build:* #${{ github.run_number }}\n*Branch:* main\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
